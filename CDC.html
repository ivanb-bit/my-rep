      <h3>Clock Death Countdown</h3>
      <div class = 'absolute-center timer' id="countdown">
    <span style = 'font-size: 3rem;'id="days">0</span> d.
    <span style = 'font-size: 3rem;'id="hours">0</span> h.
    <span style = 'font-size: 3rem;'id="minutes">0</span> min.
    <span style = 'font-size: 3rem;'id="seconds">0</span> sec.
    </div>
    <script>
    // Укажи свою целевую дату (например, конец 2026 года)
    const targetDate = new Date("July 25, 2027 23:59:59").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const timeLeft = targetDate - now;

        if (timeLeft < 0) {
            document.getElementById("countdown").innerHTML = "Время вышло!";
            return;
        }

        // Считаем дни, часы, минуты и секунды
        const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

        // Выводим цифры в HTML
        document.getElementById("days").innerText = days;
        document.getElementById("header-days").innerText = days;
        document.getElementById("hours").innerText = hours;
        document.getElementById("minutes").innerText = minutes;
        document.getElementById("seconds").innerText = seconds;
    }

    // Запускаем сразу при загрузке и обновляем каждую секунду
    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
