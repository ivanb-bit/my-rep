<!DOCTYPE html>
<html lang="ru">
<link rel="icon" type="image/ico" href="public/favicon.ico" />
<head>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <meta charset="UTF-8">
    <title>Ivan Berestovoi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <h1 class="center-me"><span id = "name">загрузка...</span></h1>

    <img src="/public/profile_picture.jpg" class = "my-image" alt="profile_picture">

    <div id="wca-stats">
        <p class="center-me">Соревнований: <span id="comps">загрузка...</span></p>
        <p class="center-me">Страна: <span id="country">загрузка...</span></p>

    </div>
    
    <h3>Коллекция медалей</h3>
    <table class="medal-table">
        <thead>
            <tr>
                <th>Золото</th>
                <th>Серебро</th>
                <th>Бронза</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="medal-count">0</td>
                <td class="medal-count">5</td>
                <td class="medal-count">1</td>
            </tr>
        </tbody>
    </table>

    <script>
        async function fetchMyStats() {
            try {
                // Стучимся на наш встроенный эндпоинт
                const res = await fetch('/api/wca');
                const data = await res.json();

                // Вставляем цифры в HTML
                document.getElementById('comps').innerText = data.competitions;
                document.getElementById('name').innerText = data.name;
                document.getElementById('medals').textContent = `Золото: ${data.medals.gold}, Серебро: ${data.medals.silver}, Бронза: ${data.medals.bronze}`;
                document.getElementById('country').innerText = data.country;
            } catch (e) {
                console.error("Ошибка:", e);
            }
        }

        fetchMyStats();
    </script>
</body>
</html>
