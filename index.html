<!DOCTYPE html>
<html lang="ru">
<link rel="icon" type="image/ico" href="public/favicon.ico" />
<head>
    <meta charset="UTF-8">
    <title>Ivan Berestovoi</title>
</head>
<body>

    <img src="/public/profile_picture.jpg" alt="profile_picture">

    <h1>Привет, я спидкубер!</h1>

    <div id="wca-stats">
        <p>Я:<span id = "name">загрузка...</span></p>
        <p>Соревнований: <span id="comps">загрузка...</span></p>
        <p>Медалей: <span id="medals">загрузка...</span></p>
        <p>Страна: <span id="country">загрузка...</span></p>

    </div>

    <script>
        async function fetchMyStats() {
            try {
                // Стучимся на наш встроенный эндпоинт
                const res = await fetch('/api/wca');
                const data = await res.json();

                // Вставляем цифры в HTML
                document.getElementById('comps').innerText = data.competitions;
                document.getElementById('name').innerText = data.name;
                document.getElementById('medals').textContent = `Золото: ${data.medals.gold}, Серебро: ${data.medals.silver}, Бронза: ${data.medals.bronze}`;
                document.getElementById('country').innerText = data.country;
            } catch (e) {
                console.error("Ошибка:", e);
            }
        }

        fetchMyStats();
    </script>
</body>
</html>
