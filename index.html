<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мое портфолио</title>
</head>
<body>
    <h1>Привет, я спидкубер!</h1>

    <div id="wca-stats">
        <p>Я:<span id = "name">загрузка...</span></p>
        <p>Соревнований: <span id="comps">загрузка...</span></p>
        <p>Медалей: Золотые:<span id="gold">загрузка...</span></p> <p>Медалей: Серебрянные:<span id="silver">загрузка...</span></p> <p>Медалей: Бронзовые:<span id="bronze">загрузка...</span></p>
        <p>Страна: <span id="country">загрузка...</span></p>

    </div>

    <script>
        async function fetchMyStats() {
            try {
                // Стучимся на наш встроенный эндпоинт
                const res = await fetch('/api/wca');
                const data = await res.json();

                // Вставляем цифры в HTML
                document.getElementById('comps').innerText = data.competitions;
                document.getElementById('name').innerText = data.name;
                document.getElementById('gold').innerText = data.medals.gold;
                document.getElementById('bronze').innerText = data.medals.bronze;
                document.getElementById('silver').innerText = data.medals.silver;
                document.getElementById('country').innerText = data.country;
            } catch (e) {
                console.error("Ошибка:", e);
            }
        }

        fetchMyStats();
    </script>
</body>
</html>
